# ============================================================
# KitaTolongKita — Docker Compose for VPS Deployment
# ============================================================
# Usage:
#   # First time
#   docker-compose up -d
#
#   # Update & rebuild
#   git pull origin master
#   docker-compose up -d --build
#
#   # View logs
#   docker-compose logs -f api
# ============================================================

version: "3.8"

services:
  # ── ElasticSearch ───────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: kita-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - ELASTICSEARCH_URL=http://localhost:9200
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── API ────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kita-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Use host.docker.internal to reach host-bound services (Postgres/Redis)
      ConnectionStrings__Default: Host=host.docker.internal;Database=kitatolongkita;Username=postgres;Password=${POSTGRES_PASSWORD:-KitaTolongKita123}
      ElasticSearch__Url: http://elasticsearch:9200
      Jwt__Secret: ${JWT_SECRET:-KitaTolongKita_SuperSecretKey_MinLength32Chars!}
      Jwt__Issuer: KitaTolongKita
      Jwt__Audience: KitaTolongKitaApp
      Jwt__AccessTokenExpiryMinutes: "60"
      App__Port: "5000"
      # AI Moderation (optional for demo — leave unset for fallback-only mode)
      # AI__Provider: azure-openai   # or: openai | anthropic
      # AI__ApiKey: your-key-here
      # AI__Endpoint: https://your-resource.openai.azure.com
      # AI__DeploymentName: gpt-4o
    ports:
      - "5000:5000"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  elasticsearch_data:
