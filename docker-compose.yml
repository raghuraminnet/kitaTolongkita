# ============================================================
# KitaTolongKita — Docker Compose for VPS Deployment
# ============================================================
# Usage:
#   # First time
#   docker-compose up -d
#
#   # Update & rebuild
#   git pull origin master
#   docker-compose up -d --build
#
#   # View logs
#   docker-compose logs -f api
# ============================================================

version: "3.8"

services:
  # ── PostgreSQL (internal only — API connects via docker network) ──
  postgres:
    image: postgres:16-alpine
    container_name: kita-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kitatolongkita
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-KitaTolongKita123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (internal only — API connects via docker network) ──────
  redis:
    image: redis:7-alpine
    container_name: kita-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # ── ElasticSearch (internal only — API connects via docker network) ──
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: kita-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - ELASTICSEARCH_URL=http://localhost:9200
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── API ──────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kita-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Database=kitatolongkita;Username=postgres;Password=${POSTGRES_PASSWORD:-KitaTolongKita123}
      Redis__Url: redis://redis:6379
      ElasticSearch__Url: http://elasticsearch:9200
      Jwt__Secret: ${JWT_SECRET:-KitaTolongKita_SuperSecretKey_MinLength32Chars!}
      Jwt__Issuer: KitaTolongKita
      Jwt__Audience: KitaTolongKitaApp
      Jwt__AccessTokenExpiryMinutes: "60"
      InternalApiKey: "${INTERNAL_API_KEY:-kita-internal-service-key-2024}"
      AI__BaseUrl: "" # Override for OpenAI-compatible APIs (e.g. https://api.groq.com, https://openrouter.ai)
      App__Port: "5000"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # ── Admin API (port 5001 — public) ─────────────────────────────────────────
  admin-api:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: kita-admin-api
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: Host=postgres;Database=kitatolongkita_admin;Username=postgres;Password=${POSTGRES_PASSWORD:-KitaTolongKita123}
      Redis__Url: redis://redis:6379
      Jwt__Secret: ${JWT_SECRET:-KitaTolongKita_SuperSecretKey_MinLength32Chars!}
      Jwt__Issuer: KitaTolongKitaAdmin
      Jwt__Audience: KitaTolongKitaAdminPortal
      Jwt__AccessTokenExpiryMinutes: "480"
      InternalApiKey: "${INTERNAL_API_KEY:-kita-internal-service-key-2024}"
      MainApi__BaseUrl: "http://kita-api:5000/api"
      App__Port: "5001"
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Admin Portal Web (port 3005 — public) ────────────────────────────────
  admin-portal:
    build:
      context: ./admin-portal
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://76.13.219.191:5001/api
    container_name: kita-admin-portal
    restart: unless-stopped
    ports:
      - "3005:3005"
    depends_on:
      - admin-api

volumes:
  postgres_data:
  elasticsearch_data:
  redis_data:
