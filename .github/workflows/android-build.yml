name: Android Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kitaTolongkita/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install dependencies
        run: |
          cd kitaTolongkita
          npm ci

      - name: Generate Android native project
        run: |
          cd kitaTolongkita
          npx expo prebuild --platform android --clean

      - name: Build Android Release
        run: |
          cd kitaTolongkita/android
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KitaTolongKita-release.apk
          path: kitaTolongkita/android/app/build/outputs/apk/release/app-release.apk
